name: Build portable PAIA Workbench
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-desktop.txt -r requirements-build.txt pytest
      - run: python -m pytest tests/test_desktop.py tests/test_annotations.py tests/test_workflow.py tests/test_fetcher.py -q
      - run: node --test tests/test_desktop_ui.cjs
      - run: python build_workbench.py
      - uses: actions/upload-artifact@v4
        with:
          name: PAIA-${{ matrix.os }}
          path: |
            output/workbench/**/*.zip
            output/workbench/**/SHA256SUMS.txt
            output/workbench/**/build_report.json
